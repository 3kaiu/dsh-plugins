name: ci
# 兼容矩阵(Phase 2):os × node ≥3 组合自动跑 build+test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: adapter 语法检查 (node --check, 防 .mjs 里混入 TS 语法导致运行时崩溃)
        run: |
          for f in packages/ui-restore/adapters/*.mjs; do
            node --check "$f" || { echo "syntax error: $f"; exit 1; }
          done
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test

  typecheck:
    # 类型检查(信息性): 全仓 .ts 实为无类型标注 JS, tsc --noEmit 现存 ~682 个
    # 契约失配错误(2026-08-29 基线; 引入 @types/node 后由 829 降至 682, 清掉全部
    # TS2591 node 全局缺失)。清零前 continue-on-error 保持 CI 绿, 错误数可在
    # job 日志中观察增量; 清零后删除 continue-on-error 即转为阻塞门禁。
    name: typecheck (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: npx tsc --noEmit
