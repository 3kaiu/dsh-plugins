name: ci
# 兼容矩阵(Phase 2):os × node ≥3 组合自动跑 build+test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: 刷新 @deepseek-ai/* 到最新(每次 CI 跟随上游 next)
        run: pnpm update "@deepseek-ai/*"
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test
