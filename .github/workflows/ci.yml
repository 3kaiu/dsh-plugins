name: ci
# 兼容矩阵(Phase 2):os × node ≥3 组合自动跑 build+test;DoD:matrix ≥3 组合 CI 自动跑
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (macos-latest / node 24)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test
