name: ci
# 兼容矩阵(Phase 2):os × node ≥3 组合自动跑 build+test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: .mjs 语法检查 (node --check, 防 .mjs 里混入 TS 语法导致运行时崩溃)
        run: |
          for f in $(git ls-files '*.mjs'); do
            node --check "$f" || { echo "syntax error: $f"; exit 1; }
          done
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test

  typecheck:
    # 类型检查(阻塞门禁): 2026-08-29 起全仓 tsc --noEmit 清零(基线 829→0, 过程见
    # chore/type-coverage 分支与 doc19)。新增类型错误将直接红 CI。
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: "build —— 先构建再查型(跨包 import 经 kit dist 解析, fresh clone 无 dist)"
        run: pnpm build
      - name: tsc --noEmit
        run: npx tsc --noEmit
