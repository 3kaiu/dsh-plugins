name: ci
# 兼容矩阵(Phase 2):os × node ≥3 组合自动跑 build+test;DoD:matrix ≥3 组合 CI 自动跑
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: test
        run: pnpm test
      - name: 兼容健康检查(doctor ≥90)
        run: node packages/dsh-maintenance-core/bin/dsh-maint.mjs doctor --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('doctor:',j.data.score+'/100',j.data.verdict);if(!j.ok||j.data.score<90)process.exit(1)})"
