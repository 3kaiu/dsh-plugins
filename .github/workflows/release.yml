name: release-plugins
# 插件 tarball 发行:GitHub 上直接构建产物(pnpm build),pnpm pack 生成
# tarball 挂到 Release——不依赖 npm 发布/账号,不用提交 dist。
# 触发:tag v* 或 workflow_dispatch(手动)。
# 安装: dsh plugin --profile web add https://github.com/3kaiu/dsh-plugins/releases/latest/download/<包名>-<版本>.tgz
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build(GitHub 上构建全部产物)
        run: pnpm build
      - name: pack 插件 tarball
        run: |
          mkdir -p dist-tgz
          for p in layout-infer llm-opencode-zen; do
            (cd packages/$p && pnpm pack --pack-destination ../../dist-tgz/)
          done
      - name: 校验和
        run: (cd dist-tgz && shasum -a 256 *.tgz) > SHA256SUMS
      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        # tag 同时编码两个插件的版本(v<llm>+li<layout>),避免单独升级
        # layout-infer 时 Release 命名与内容脱节;安装器只按 API 解析 latest,
        # 不依赖 tag 命名格式。
        run: |
          LLM_VER=$(node -e "console.log(require('./packages/llm-opencode-zen/package.json').version)")
          LI_VER=$(node -e "console.log(require('./packages/layout-infer/package.json').version)")
          TAG="v${LLM_VER}+li${LI_VER}"
          gh release create "$TAG" dist-tgz/*.tgz SHA256SUMS --title "DSH Plugins $TAG" --notes "llm-opencode-zen@${LLM_VER} + layout-infer@${LI_VER}。tarball 安装见 README(安装脚本会做 SHA-256 校验)" || gh release upload "$TAG" dist-tgz/*.tgz SHA256SUMS --clobber

