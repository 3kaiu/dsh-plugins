name: release-workbench
# Console 工作台发行构建(plugins 仓库产物):workflow_dispatch 或 tag v* 触发
# 边界:启动器/官方 Harness 生命周期属 3kaiu/dsh-launcher(独立仓库,自有 release.yml)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号(如 0.1.0;留空用 console package.json)
        required: false
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm
        run: npm install -g pnpm@9.15.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build console(PWA 产物)
        run: pnpm --filter @3kaiu/dsh-console build
      - name: bundle(TS 发行脚本)
        run: node scripts/release.ts "${{ github.event_name == 'workflow_dispatch' && format('--version {0}', inputs.version) || '' }}"
      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -e "console.log(require('./packages/dsh-console/package.json').version)")
          gh release create "workbench-v$VER" dist-release/dsh-workbench-$VER.zip dist-release/SHA256SUMS --title "DSH Workbench v$VER" --notes "Console 工作台:解压 → ./start.sh → 打开 http://127.0.0.1:3090(Safari 添加到程序坞 = PWA)。官方 Harness(3080)用 3kaiu/dsh-launcher。" || gh release upload "workbench-v$VER" dist-release/dsh-workbench-$VER.zip dist-release/SHA256SUMS --clobber
