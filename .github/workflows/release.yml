name: build-plugins

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack tarballs
        run: |
          mkdir -p out
          for d in packages/llm-opencode-zen packages/harness-updater packages/layout-infer; do
            (cd "$d" && pnpm pack --pack-destination ../../out)
          done
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-tarballs
          path: out/*.tgz

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tgz
          generate_release_notes: true
