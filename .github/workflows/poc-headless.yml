name: poc-headless-zen

on:
  workflow_dispatch:

concurrency:
  group: poc-headless-zen
  cancel-in-progress: true

env:
  OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}

jobs:
  probe-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe OpenCode Zen (free tier)
        run: bash scripts/poc-zen-headless.sh .dsh/state/poc
      - name: Show result
        run: cat .dsh/state/poc/summary.txt && echo "---" && cat .dsh/state/poc/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poc-probe-ubuntu
          path: .dsh/state/poc/
          retention-days: 7
