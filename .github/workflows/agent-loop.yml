name: agent-loop

on:
  workflow_dispatch:
    inputs:
      task:
        description: 无头 Agent 的任务(单行;默认:自检插件测试 + 写运行记录)
        required: false
        default: "在本仓库根目录:1) 运行 node packages/llm-opencode-zen/test/rate-limit.test.mjs 并确认它通过;2) 把一行追加到 docs/architecture/AGENT-LOOP.md,内容为竖线分隔的今天日期与 pass;3) 最后一行输出 VERDICT: pass"
      open_pr:
        description: 用 Agent 产物开 PR(人工 merge,不自动合)
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-loop
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 注入 DSH_HOME(RUNNER_TEMP,隔离于 ~/.dsh)
        run: echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装官方 dsh 与 pnpm(dsh 跟随 next 最新预发布)
        run: npm i -g @deepseek-ai/dsh@next pnpm@9.15.0

      - name: 构建插件(未发布 npm,从仓库构建;dsh 依赖刷新到最新)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm update "@deepseek-ai/*"
          (cd packages/shared && node build.mjs)
          (cd packages/layout-infer && node build.mjs)
          (cd packages/llm-opencode-zen && node build.mjs)

      - name: 装进 headless profile(与本地验证配方一致)
        run: |
          dsh --profile headless --help >/dev/null
          cd "$DSH_HOME/profiles/headless"
          pnpm add -w "file:${GITHUB_WORKSPACE}/packages/llm-opencode-zen" "file:${GITHUB_WORKSPACE}/packages/layout-infer"
          node -e '
            const fs = require("fs");
            const p = "package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            const b = pkg.dsh.profile.bundles;
            for (const id of ["@3kaiu/dsh-llm-opencode-zen", "@3kaiu/dsh-layout-infer"]) {
              if (!b.includes(id)) b.push(id);
            }
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            console.log("bundles:", b.join(", "));
          '

      - name: 双插件宿主内冒烟(bundle 组合加载)
        # --dump-config 实际组合 profile 的 bundle 补丁层:external 的 @deepseek-ai/*
        # 解析失败或 bundle 加载出错都会在这里暴露——离线单测覆盖不到的运行时路径。
        run: |
          dsh --profile headless --dump-config > /tmp/composed.txt
          for id in "@3kaiu/dsh-llm-opencode-zen" "@3kaiu/dsh-layout-infer"; do
            grep -q "$id" /tmp/composed.txt \
              && echo "[smoke] $id 已进入组合配置 OK" \
              || { echo "[smoke] $id 未出现在组合配置中"; exit 1; }
          done

      - name: 默认模型指向 opencode-zen(免费层,零凭证)
        run: |
          printf 'agent-default-model:\n  provider: opencode-zen\n  model: deepseek-v4-flash-free\n' > "$DSH_HOME/settings.yaml"

      - name: 无头 Agent 执行任务(预算:单任务,20min 上限)
        # dispatch 输入经 env 传递:任务文本对 shell 完全不可见(不做任何解析)
        env:
          INPUT_TASK: ${{ github.event.inputs.task }}

        run: |
          dsh --profile headless "$INPUT_TASK" | tee /tmp/agent-output.txt
          test -s /tmp/agent-output.txt && echo "[agent-loop] 输出非空 OK"

      - name: 校验 Agent 产物
        run: |
          if test -f docs/architecture/AGENT-LOOP.md; then tail -3 docs/architecture/AGENT-LOOP.md; else echo "[agent-loop] Agent 未写记录文件(检查工具沙箱)"; fi

      - name: 开 PR(人工 merge,不自动合;被设置拦则打印链接,不失败)
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dsh-agent"
          git config user.email "dsh-agent@users.noreply.github.com"
          BR="agent-loop/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BR"
          git add -A
          if git diff --quiet origin/main -- .; then
            echo "[agent-loop] 无变更,跳过 PR"
            exit 0
          fi
          git commit -m "agent-loop: 自动运行记录 $(date -u +%Y-%m-%d)" 2>/dev/null \
            || echo "[agent-loop] 工作树已干净(Agent 可能已自行提交),直接推送"
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "agent-loop 自动记录 $(date -u +%Y-%m-%d)" \
            --body "由 agent-loop 工作流自动生成,请人工审查后合并。Agent 输出见工作流日志 step 日志。" \
            && echo "[agent-loop] PR 已自动创建" \
            || { echo "[agent-loop] 仓库设置禁止 Actions 开 PR,请手动创建:"; echo "  https://github.com/3kaiu/dsh-plugins/pull/new/$BR"; }
