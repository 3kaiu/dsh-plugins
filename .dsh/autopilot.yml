# dsh-autopilot 配置(06 篇 §9;解析器 yaml-mini.mjs:列表必须行内形态)
version: 1
agent:
  provider: opencode-zen
  model: deepseek-v4-flash-free
schedule:
  cron: "0 2 * * *"
  tz: Asia/Shanghai
selection:
  max_tasks_per_run: 1
repair:
  max_attempts: 3
  max_changed_files: 15
  max_diff_lines: 500
  max_runtime: 15m
verification:
  required: [typecheck, test, regression]
git:
  strategy: pull_request
  branch_prefix: maintenance/
merge:
  mode: guarded
permissions:
  allow: [packages/**, tests/**, fixtures/**, .dsh/knowledge/**, .dsh/incidents/**, docs/**]
  deny: [.github/workflows/release.yml, .dsh/autopilot.yml, LICENSE, "**/package.json"]
budget:
  max_runs_per_day: 3
  max_attempts_per_issue: 3
  max_changed_files: 15
  max_diff_lines: 500
  max_runtime: 15m
